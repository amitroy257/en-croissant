name: Release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      # One at a time, so the second job uploads to the release the first one created.
      max-parallel: 1
      # This fork only ships macOS builds.
      matrix:
        include:
          - platform: 'macos-latest' # for Arm based macs (M1 and above).
            args: '--target aarch64-apple-darwin --bundles dmg'
          - platform: 'macos-latest' # for Intel based macs.
            args: '--target x86_64-apple-darwin --bundles dmg'
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-0=2.44.0-2 \
            libwebkit2gtk-4.1-dev=2.44.0-2 \
            libjavascriptcoregtk-4.1-0=2.44.0-2 \
            libjavascriptcoregtk-4.1-dev=2.44.0-2 \
            gir1.2-javascriptcoregtk-4.1=2.44.0-2 \
            gir1.2-webkit2-4.1=2.44.0-2 \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable
        with:
          # Only install macos targets on macos runners
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Sync node version and setup cache
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "pnpm"

      - name: Install app dependencies
        run: pnpm install --frozen-lockfile

      # Fork builds: the updater key and update server belong to upstream, so skip the
      # signed updater artifacts and don't offer upstream updates, which would replace
      # this build and its features.
      - name: Fork build config
        shell: bash
        run: |
          echo '{"bundle":{"createUpdaterArtifacts":false},"plugins":{"updater":{"endpoints":[]}}}' \
            > "$RUNNER_TEMP/fork.conf.json"

      - name: Build the app
        uses: tauri-apps/tauri-action@v0

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI: false
        with:
          # Tag pushes release under that tag; manual runs get a numbered fork tag.
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || format('v__VERSION__-fork.{0}', github.run_number) }}
          releaseName: "En Croissant __VERSION__ (fork build)"
          releaseBody: |
            Custom macOS build of En Croissant from this fork. See "Additions in this fork" in the README for what it adds.

            ## Install
            Download the `.dmg` for your Mac (`aarch64` = Apple Silicon M1 and later, `x64` = Intel), open it and drag En Croissant into Applications.

            The app isn't notarized by Apple, so macOS blocks the first launch. Open it once with right-click → Open (or System Settings → Privacy & Security → Open Anyway), or run:
            `xattr -dr com.apple.quarantine /Applications/en-croissant.app`
          # Drafts are only visible to the repo owner; publish after checking the build.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }} --config ${{ runner.temp }}/fork.conf.json
